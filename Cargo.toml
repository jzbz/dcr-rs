# dcr-rs
#
# The hard rule here: we hand-roll NOTHING that touches elliptic-curve math or
# standard KDFs. Those come from audited crates. We only own Decred-specific
# glue (BLAKE-256, sighash byte layout, tx serialization, address encoding,
# derivation orchestration, airgap format).

[package]
name = "dcr-rs"
version = "0.4.0"
edition = "2021"
# Set by the dependency floor, not by this crate's own source: zeroize 1.9 and
# zeroize_derive 1.5 declare 1.85. Embedded targets often sit on a pinned
# toolchain, so state it rather than letting the failure surface from inside a
# dependency. Lowering it means capping `zeroize` at 1.8.
rust-version = "1.85"
description = "Decred (DCR) primitives: BLAKE-256, addresses, HD keys, transaction wire format, and SigHashAll signing"
license = "ISC"
repository = "https://github.com/jzbz/dcr-rs"
keywords = ["decred", "dcr", "cryptocurrency", "blake256", "bip32"]
categories = ["cryptography::cryptocurrencies", "no-std"]

[features]
default = ["std", "mnemonic", "airgap"]
# Links std into dependencies and implements std::error::Error. Disable for
# no_std targets (the crate itself only ever needs `alloc`).
std = [
    "secp256k1/std",
    "bs58/std",
    "sha2/std",
    "hmac/std",
    "ripemd/std",
    "bip39?/std",
    "minicbor?/std",
]
# BIP39 mnemonic/entropy -> seed expansion (ExtPrivKey::from_entropy/from_phrase).
mnemonic = ["dep:bip39"]
# The CBOR air-gapped sign-request format shared with the KeyOS and Keystone
# Decred signers.
airgap = ["dep:minicbor"]

[dependencies]
secp256k1 = { version = "0.29", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
ripemd = { version = "0.1", default-features = false }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
# `alloc` is a DEFAULT feature of zeroize that carries `impl Zeroize for Vec<T>`.
# Without it `vec.zeroize()` silently resolves to the `[T]` impl via deref, which
# wipes only the current contents and leaves spare capacity (where a base58
# decoder's intermediates sit) untouched. The Vec impl clears the full capacity.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
bip39 = { version = "2.1", default-features = false, features = ["alloc", "zeroize"], optional = true }
# Pinned to the 0.24 line: the airgap format's derived CBOR layout must stay
# byte-identical, and the derive macro's attribute semantics are part of that.
# Note `#[b(n)]` means *borrowed*, not bytes — byte-string fields need
# `#[cbor(n(n), with = "minicbor::bytes")]`, which is what FORMAT_VERSION 3 uses.
minicbor = { version = "0.24", default-features = false, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
hex = "0.4"
