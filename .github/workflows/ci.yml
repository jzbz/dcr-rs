name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --features mnemonic
      - run: cargo test --no-default-features --features airgap
      - run: cargo test --no-default-features --features mnemonic,airgap

  # `rust-version` is a promise to every consumer of the published crate,
  # and until now nothing checked it: one use of a newer std API, or a
  # dependency raising its own floor, would have broken the embedded
  # builds this crate is aimed at without any signal here. The matrix
  # mirrors the test job because a feature-gated API is exactly where a
  # too-new call hides.
  #
  # `--locked` throughout, which is why Cargo.lock is committed. Resolving
  # freely here would mean a dependency raising ITS floor turns this job red
  # on an unrelated pull request, and the failure would surface from inside
  # that dependency — exactly the confusing break this job exists to prevent.
  # The `test` job below stays unlocked on purpose, so upstream breakage is
  # still seen early; same split as `lint` (pinned) versus `lint-latest`.
  msrv:
    name: MSRV build (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo check --locked --all-targets --all-features
      - run: cargo check --locked --all-targets --no-default-features
      - run: cargo check --locked --all-targets --no-default-features --features mnemonic
      - run: cargo check --locked --all-targets --no-default-features --features airgap
      - run: cargo check --locked --all-targets --no-default-features --features mnemonic,airgap
      # secp256k1-sys builds C for the target, so the cross-compiler has to be
      # here for the same reason the no-std job installs it. A host-only matrix
      # would miss an MSRV break that only bare metal reaches.
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: cargo check --locked --target thumbv7em-none-eabihf --no-default-features --features mnemonic,airgap

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned rather than floating: `-D warnings` on a channel that gains
      # lints every six weeks turns pull requests red for reasons their
      # author did not cause. Bump this deliberately, the way the MSRV is
      # bumped; lint-latest below is what makes the bump visible.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- -D warnings

  lint-latest:
    name: clippy on latest stable (advisory)
    runs-on: ubuntu-latest
    # Advisory: reports what the next pinned bump will have to fix,
    # without blocking anything in the meantime.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-features --all-targets -- -D warnings

  # Prove the crate really builds without std: cross-check for a bare-metal
  # target where no std exists to fall back on.
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: cargo check --target thumbv7em-none-eabihf --no-default-features --features mnemonic,airgap

  # A published version is immutable, so a packaging mistake is only fixable
  # by releasing again. Build the .crate and compile it from its own
  # contents, exactly as `cargo publish` would, on every change instead.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked

  # docs.rs builds once per version and never again, so a rustdoc failure
  # there stays on the crate's page until the next release. The reduced-
  # feature builds are the ones default-features = false consumers see.
  # Pinned for the same reason lint is: -D warnings on a floating channel.
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo doc --no-deps --all-features
      - run: cargo doc --no-deps --no-default-features
      - run: cargo doc --no-deps --no-default-features --features mnemonic
      - run: cargo doc --no-deps --no-default-features --features airgap
      - run: cargo doc --no-deps --no-default-features --features mnemonic,airgap
