name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --features mnemonic
      - run: cargo test --no-default-features --features airgap
      - run: cargo test --no-default-features --features mnemonic,airgap

  # `rust-version` is a promise to every consumer of the published crate,
  # and until now nothing checked it: one use of a newer std API, or a
  # dependency raising its own floor, would have broken the embedded
  # builds this crate is aimed at without any signal here. The matrix
  # mirrors the test job because a feature-gated API is exactly where a
  # too-new call hides.
  msrv:
    name: MSRV build (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo check --all-targets --all-features
      - run: cargo check --all-targets --no-default-features
      - run: cargo check --all-targets --no-default-features --features mnemonic
      - run: cargo check --all-targets --no-default-features --features airgap
      - run: cargo check --all-targets --no-default-features --features mnemonic,airgap
      # secp256k1-sys builds C for the target, so the cross-compiler has to be
      # here for the same reason the no-std job installs it. A host-only matrix
      # would miss an MSRV break that only bare metal reaches.
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: cargo check --target thumbv7em-none-eabihf --no-default-features --features mnemonic,airgap

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than floating: `-D warnings` on a channel that gains
      # lints every six weeks turns pull requests red for reasons their
      # author did not cause. Bump this deliberately, the way the MSRV is
      # bumped; lint-latest below is what makes the bump visible.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- -D warnings

  lint-latest:
    name: clippy on latest stable (advisory)
    runs-on: ubuntu-latest
    # Advisory: reports what the next pinned bump will have to fix,
    # without blocking anything in the meantime.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-features --all-targets -- -D warnings

  # Prove the crate really builds without std: cross-check for a bare-metal
  # target where no std exists to fall back on.
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: cargo check --target thumbv7em-none-eabihf --no-default-features --features mnemonic,airgap
